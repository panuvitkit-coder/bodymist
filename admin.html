<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการสั่งซื้อ | Body Scent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Page-specific styles (admin only) */
    .page-head { padding-block: clamp(3rem, 2rem + 4vw, 5rem); }
    .page-head h1 { font-size: var(--fs-xl); line-height: 1.4; }

    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    #ordersTable {
      width: 100%;
      min-width: 52rem;
      border-collapse: collapse;
      font-size: var(--fs-sm);
    }
    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.25rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }
    #ordersTable thead th {
      font-size: var(--fs-xs);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      background: var(--cream);
      white-space: nowrap;
    }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody tr:hover td { background: var(--cream); }
    #ordersTable td:nth-child(1),
    #ordersTable td:nth-child(5) { white-space: nowrap; }
    #ordersTable td:nth-child(4),
    #ordersTable td:nth-child(6) { min-width: 12rem; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section--cream page-head">
      <div class="container">
        <div class="section-head text-center" style="margin-bottom: 0;">
          <h1>รายการสั่งซื้อ</h1>
          <span class="rule"></span>
          <p>แสดงรายการล่าสุดไว้ด้านบน</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
